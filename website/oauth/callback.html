<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Epic Sandbox Authorization | Personal Health Record Assistant</title>
    <style>
        :root { color-scheme: light; --navy: #123b56; --paper: #f4f7f8; --ink: #1d2c35; --border: #d8e1e5; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 Arial, Helvetica, sans-serif; }
        main { width: min(100% - 2rem, 700px); margin: 3rem auto; padding: clamp(1.25rem, 5vw, 2.5rem); border: 1px solid var(--border); border-radius: 0.75rem; background: #fff; }
        h1 { color: var(--navy); line-height: 1.2; }
        a { color: #075d7c; }
        #status { overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <h1>Epic sandbox authorization</h1>
        <p id="status" role="status" aria-live="polite">Completing the sandbox authorization…</p>
        <p id="details"></p>
        <section id="results" hidden aria-labelledby="results-heading">
            <h2 id="results-heading">Synthetic test results</h2>
            <p>FHIR data shown here is synthetic Epic sandbox data and remains only in this page.</p>
            <section aria-labelledby="reports-heading">
                <h3 id="reports-heading">Diagnostic reports</h3>
                <p id="reports-status"></p>
                <ul id="reports-list"></ul>
            </section>
            <section aria-labelledby="observations-heading">
                <h3 id="observations-heading">Laboratory observations</h3>
                <p id="observations-status"></p>
                <ul id="observations-list"></ul>
            </section>
        </section>
        <p><a href="/oauth/index.html">Return to sandbox test</a></p>
    </main>
    <script src="/oauth/config.js"></script>
    <script>
        (() => {
            'use strict';

            const config = window.EPIC_SANDBOX_CONFIG;
            const status = document.getElementById('status');
            const details = document.getElementById('details');
            const results = document.getElementById('results');
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const returnedState = params.get('state');
            const oauthError = params.get('error');
            const oauthDescription = params.get('error_description');
            const storagePrefix = 'epicSandbox.';

            window.history.replaceState({}, document.title, window.location.pathname);

            function fail(message) {
                status.textContent = message;
            }

            function displayForCodeableConcept(concept) {
                if (!concept) {
                    return '';
                }
                return concept.text || concept.coding?.find((coding) => coding.display)?.display || '';
            }

            function displayForObservationValue(observation) {
                const quantity = observation.valueQuantity;
                if (quantity) {
                    return [quantity.value, quantity.unit || quantity.code].filter(Boolean).join(' ');
                }
                const concept = displayForCodeableConcept(observation.valueCodeableConcept);
                if (concept) {
                    return concept;
                }
                for (const key of ['valueString', 'valueInteger', 'valueDecimal', 'valueBoolean', 'valueDateTime', 'valueDate', 'valueTime']) {
                    if (observation[key] !== undefined) {
                        return String(observation[key]);
                    }
                }
                const range = observation.valueRange;
                if (range) {
                    const low = range.low ? `${range.low.value ?? ''} ${range.low.unit || ''}`.trim() : '';
                    const high = range.high ? `${range.high.value ?? ''} ${range.high.unit || ''}`.trim() : '';
                    return [low, high].filter(Boolean).join(' – ');
                }
                return 'No simple value';
            }

            function appendListItem(list, title, metadata) {
                const item = document.createElement('li');
                const heading = document.createElement('strong');
                heading.textContent = title || 'Unnamed result';
                item.appendChild(heading);
                if (metadata) {
                    item.appendChild(document.createTextNode(` — ${metadata}`));
                }
                list.appendChild(item);
            }

            function resultDate(resource) {
                const period = resource.effectivePeriod || resource.performedPeriod;
                return resource.effectiveDateTime || resource.issued || resource.date || period?.start || '';
            }

            async function fetchSearchResults(resourceType, searchParams, accessToken) {
                const base = new URL(config.fhirBaseUrl);
                const url = new URL(`${resourceType}`, `${base.href.replace(/\/?$/, '/')}`);
                url.search = searchParams.toString();
                const resources = [];
                const visited = new Set();
                let nextUrl = url.href;
                let truncated = false;

                for (let page = 0; nextUrl && page < 10; page += 1) {
                    const current = new URL(nextUrl);
                    if (current.origin !== base.origin || !current.pathname.startsWith(`${base.pathname}/`) || visited.has(current.href)) {
                        throw new Error('Epic returned an invalid or repeated pagination link.');
                    }
                    visited.add(current.href);
                    const response = await fetch(current.href, {
                        headers: {
                            Authorization: `Bearer ${accessToken}`,
                            Accept: 'application/fhir+json'
                        },
                        cache: 'no-store',
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer'
                    });
                    if (!response.ok) {
                        const errorBody = await response.text();
                        let errorDetails = '';
                        try {
                            const outcome = JSON.parse(errorBody);
                            if (outcome.resourceType === 'OperationOutcome' && Array.isArray(outcome.issue)) {
                                errorDetails = outcome.issue
                                    .map((issue) => issue.diagnostics || issue.details?.text || issue.code)
                                    .filter(Boolean)
                                    .join(' ');
                            }
                        } catch (error) {
                            if (!(error instanceof SyntaxError)) {
                                throw error;
                            }
                        }
                        throw new Error(`HTTP ${response.status}${errorDetails ? `: ${errorDetails.slice(0, 400)}` : ''}`);
                    }
                    const bundle = await response.json();
                    if (bundle.resourceType !== 'Bundle' || !Array.isArray(bundle.entry)) {
                        throw new Error('Epic returned an unexpected search response.');
                    }
                    resources.push(...bundle.entry
                        .map((entry) => entry.resource)
                        .filter((resource) => resource?.resourceType === resourceType));
                    nextUrl = bundle.link?.find((link) => link.relation === 'next')?.url || '';
                    if (nextUrl && page === 9) {
                        truncated = true;
                    }
                }
                return { resources, truncated };
            }

            function showSearchError(label, target, error) {
                const requirement = error.message === 'HTTP 403'
                    ? ` Confirm ${label} is enabled for the MyHealthDataA nonproduction app.`
                    : '';
                target.textContent = `Could not load ${label}: ${error.message}.${requirement}`;
            }

            async function showTestResults(patientId, accessToken) {
                results.hidden = false;
                const reportList = document.getElementById('reports-list');
                const reportStatus = document.getElementById('reports-status');
                const observationList = document.getElementById('observations-list');
                const observationStatus = document.getElementById('observations-status');
                const reportParams = new URLSearchParams({
                    patient: patientId,
                    category: 'http://terminology.hl7.org/CodeSystem/v2-0074|LAB',
                    _count: '100'
                });
                const observationParams = new URLSearchParams({
                    patient: patientId,
                    category: 'laboratory',
                    _count: '100'
                });

                const [reports, observations] = await Promise.allSettled([
                    fetchSearchResults('DiagnosticReport', reportParams, accessToken),
                    fetchSearchResults('Observation', observationParams, accessToken)
                ]);

                if (reports.status === 'fulfilled') {
                    const items = reports.value.resources;
                    reportStatus.textContent = `${items.length} diagnostic report(s) found${reports.value.truncated ? '; additional pages not shown' : ''}.`;
                    for (const report of items) {
                        const name = displayForCodeableConcept(report.code) || report.resourceType;
                        const metadata = [report.status, resultDate(report), report.conclusion].filter(Boolean).join(' · ');
                        appendListItem(reportList, name, metadata);
                    }
                    if (!items.length) {
                        appendListItem(reportList, 'No diagnostic reports returned', '');
                    }
                } else {
                    showSearchError('DiagnosticReport.Search', reportStatus, reports.reason);
                }

                if (observations.status === 'fulfilled') {
                    const items = observations.value.resources;
                    observationStatus.textContent = `${items.length} laboratory observation(s) found${observations.value.truncated ? '; additional pages not shown' : ''}.`;
                    for (const observation of items) {
                        const name = displayForCodeableConcept(observation.code) || observation.resourceType;
                        const metadata = [displayForObservationValue(observation), observation.status, resultDate(observation)].filter(Boolean).join(' · ');
                        appendListItem(observationList, name, metadata);
                    }
                    if (!items.length) {
                        appendListItem(observationList, 'No laboratory observations returned', '');
                    }
                } else {
                    showSearchError('Observation.Search', observationStatus, observations.reason);
                }

                return reports.status === 'fulfilled' && observations.status === 'fulfilled';
            }

            async function completeAuthorization() {
                if (oauthError) {
                    sessionStorage.removeItem(`${storagePrefix}verifier`);
                    sessionStorage.removeItem(`${storagePrefix}state`);
                    fail(`Authorization was not completed: ${oauthDescription || oauthError}`);
                    return;
                }

                const expectedState = sessionStorage.getItem(`${storagePrefix}state`);
                const verifier = sessionStorage.getItem(`${storagePrefix}verifier`);
                sessionStorage.removeItem(`${storagePrefix}state`);
                sessionStorage.removeItem(`${storagePrefix}verifier`);

                if (!code || !returnedState || !expectedState || returnedState !== expectedState || !verifier) {
                    fail('The authorization response could not be verified. Return to the sandbox test and try again.');
                    return;
                }

                status.textContent = 'Exchanging the one-time authorization code with Epic…';
                try {
                    const body = new URLSearchParams({
                        grant_type: 'authorization_code',
                        code,
                        redirect_uri: config.redirectUri,
                        client_id: config.clientId,
                        code_verifier: verifier
                    });
                    const response = await fetch(config.tokenUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body,
                        cache: 'no-store',
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer'
                    });
                    if (!response.ok) {
                        throw new Error(`Epic token exchange failed (HTTP ${response.status}). Verify that this exact callback URL is registered for the nonproduction client.`);
                    }

                    const token = await response.json();
                    if (!token.access_token) {
                        throw new Error('Epic did not return an access token.');
                    }
                    if (!token.patient) {
                        throw new Error('Authorization succeeded, but Epic did not return a patient context. Confirm patient-facing standalone launch and the launch/patient scope in Epic registration.');
                    }

                    const patientResponse = await fetch(`${config.fhirBaseUrl}/Patient/${encodeURIComponent(token.patient)}`, {
                        headers: {
                            Authorization: `Bearer ${token.access_token}`,
                            Accept: 'application/fhir+json'
                        },
                        cache: 'no-store',
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer'
                    });
                    if (!patientResponse.ok) {
                        throw new Error(`Authorization succeeded, but the sandbox Patient read failed (HTTP ${patientResponse.status}).`);
                    }

                    const patient = await patientResponse.json();
                    if (patient.resourceType !== 'Patient') {
                        throw new Error('Epic returned an unexpected resource type.');
                    }

                    status.textContent = 'Patient authorization succeeded. Searching for synthetic test results…';
                    const searchesSucceeded = await showTestResults(token.patient, token.access_token);
                    status.textContent = searchesSucceeded
                        ? 'End-to-end sandbox test succeeded: authorization, Patient read, and test-result searches completed.'
                        : 'Patient authorization succeeded, but one or more test-result searches failed. See details below.';
                    details.textContent = 'The records are synthetic sandbox data. The access token was kept in memory only and was not displayed or saved.';
                } catch (error) {
                    fail(error.message);
                }
            }

            completeAuthorization().catch((error) => {
                fail(`Sandbox test failed: ${error.message}`);
            });
        })();
    </script>
</body>
</html>
